services:
  - type: web
    name: dtpt-techs-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dtpt-techs-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_USERNAME
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: ADMIN_DEFAULT_DISPLAY_NAME
        value: DTPT Admin

databases:
  - name: dtpt-techs-postgres
    plan: free
