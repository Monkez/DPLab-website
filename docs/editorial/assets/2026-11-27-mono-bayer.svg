<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
  <title id="title">Bốn điểm ảnh mono và ví dụ mảng Bayer RGGB</title>
  <desc id="desc">Bên trái bốn photosite đơn sắc ghi độ sáng; bên phải ví dụ Bayer RGGB, mỗi ô có một bộ lọc đỏ, xanh lá hoặc xanh dương. Đây là sơ đồ nguyên lý, không phải ảnh cảm biến hoặc kết quả đo.</desc>
  <rect width="720" height="690" fill="#f5f7fa"/>
  <g font-family="Arial, sans-serif" fill="#17314b">
    <text x="32" y="41" font-size="20" font-weight="700">DTPT TECHS · MINH HỌA NGUYÊN LÝ</text>
    <text x="32" y="89" font-size="32" font-weight="700">BAYER VÀ MONO KHÁC GÌ?</text>
    <text x="65" y="144" font-size="28" font-weight="700">Đơn sắc</text>
    <text x="406" y="144" font-size="25" font-weight="700">Bayer RGGB (ví dụ)</text>
    <g stroke="#8394a6" stroke-width="2" fill="#d5dce4">
      <rect x="52" y="166" width="120" height="120" rx="8"/><rect x="182" y="166" width="120" height="120" rx="8"/>
      <rect x="52" y="296" width="120" height="120" rx="8"/><rect x="182" y="296" width="120" height="120" rx="8"/>
    </g>
    <g font-size="34" text-anchor="middle" font-weight="700">
      <text x="112" y="239">I₁</text><text x="242" y="239">I₂</text><text x="112" y="369">I₃</text><text x="242" y="369">I₄</text>
    </g>
    <rect x="408" y="166" width="120" height="120" rx="8" fill="#b82c3a"/><rect x="538" y="166" width="120" height="120" rx="8" fill="#a8d7b8"/>
    <rect x="408" y="296" width="120" height="120" rx="8" fill="#a8d7b8"/><rect x="538" y="296" width="120" height="120" rx="8" fill="#2358b2"/>
    <g font-size="34" text-anchor="middle" font-weight="700">
      <text x="468" y="239" fill="#fff">R</text><text x="598" y="239">G</text><text x="468" y="369">G</text><text x="598" y="369" fill="#fff">B</text>
    </g>
    <text x="52" y="458" font-size="24">Mỗi ô ghi độ sáng.</text>
    <text x="390" y="458" font-size="24">Mỗi ô lọc một kênh màu.</text>
    <rect x="28" y="490" width="664" height="117" rx="14" fill="#fff" stroke="#acb8c5"/>
    <text x="48" y="529" font-size="25">Bayer raw chưa phải RGB đầy đủ tại mỗi ô.</text>
    <text x="48" y="568" font-size="25">Nội suy ước lượng các thành phần màu còn thiếu.</text>
    <text x="32" y="645" font-size="23">Sơ đồ cấu trúc; không phải ảnh hay phép đo cảm biến.</text>
    <text x="32" y="677" font-size="22">I₁–I₄ chỉ ký hiệu các giá trị, không phải số đo thực tế.</text>
  </g>
</svg>
