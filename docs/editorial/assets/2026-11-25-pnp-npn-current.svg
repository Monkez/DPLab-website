<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">Đường dòng PNP và NPN khi ngõ ra cảm biến ON</title>
  <desc id="desc">Ví dụ DC 24 V. PNP cấp dòng từ cực dương qua ngõ ra, vào IN, qua mạch ngõ vào PLC và về COM 0 V. NPN kéo dòng từ COM dương qua mạch vào PLC, IN và ngõ ra cảm biến về 0 V. Chỉ thể hiện nguyên lý, không phải sơ đồ đấu chân.</desc>
  <rect width="720" height="780" fill="#f4f7fa"/>
  <g font-family="Arial, sans-serif" fill="#18334e">
    <text x="32" y="42" font-size="20" font-weight="700">DTPT TECHS · MINH HỌA NGUYÊN LÝ</text>
    <text x="32" y="88" font-size="31" font-weight="700">PNP / NPN: XEM ĐƯỜNG DÒNG</text>
    <text x="32" y="123" font-size="24">Ví dụ DC 24 V · ngõ ra đang ON</text>
    <rect x="28" y="150" width="664" height="244" rx="18" fill="#e5f2ec" stroke="#4c8b71" stroke-width="2"/>
    <text x="52" y="192" font-size="28" font-weight="700">PNP → ngõ vào PLC sinking</text>
    <text x="52" y="239" font-size="28">1. +24 V → ngõ ra PNP → IN</text>
    <text x="52" y="303" font-size="28">2. Mạch vào PLC → COM 0 V</text>
    <text x="52" y="365" font-size="24">Cảm biến cấp dòng cho ngõ vào.</text>
    <rect x="28" y="418" width="664" height="244" rx="18" fill="#e5eefb" stroke="#577eae" stroke-width="2"/>
    <text x="52" y="460" font-size="28" font-weight="700">NPN → ngõ vào PLC sourcing</text>
    <text x="52" y="507" font-size="28">1. COM +24 V → mạch vào PLC</text>
    <text x="52" y="571" font-size="28">2. IN → ngõ ra NPN → 0 V</text>
    <text x="52" y="633" font-size="24">Cảm biến kéo dòng về 0 V.</text>
    <text x="32" y="710" font-size="23">Dòng 1 → 2 nối tiếp nhau; dòng quy ước khi ON.</text>
    <text x="32" y="743" font-size="23">Không phải sơ đồ đấu chân; đã lược mạch nguồn.</text>
    <text x="32" y="773" font-size="20">Đối chiếu manual của đúng cảm biến và card input.</text>
  </g>
</svg>
