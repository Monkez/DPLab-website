<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">Vòng mạng còn đường đi, HMI vẫn có thể mất kết nối</title>
  <desc id="desc">Bốn switch A B C D nối vòng. Switch B hỏng làm HMI chỉ nối với B mất kết nối. A và C còn liên lạc qua D sau khi cơ chế vòng phù hợp chuyển đường.</desc>
  <rect width="720" height="820" rx="24" fill="#f5f8fb"/>
  <g font-family="Arial, sans-serif" fill="#173249">
    <text x="36" y="51" font-size="25" font-weight="700">Vòng còn đường, HMI vẫn có thể mất</text>
    <text x="36" y="88" font-size="19">Một lỗi switch • phạm vi bảo vệ khác nhau</text>
    <rect x="30" y="114" width="660" height="530" rx="18" fill="white" stroke="#d5e0e9" stroke-width="2"/>
    <g fill="none" stroke-width="8" stroke-linecap="round">
      <path d="M178 293 H520 V470" stroke="#b4bdc7" stroke-dasharray="9 13"/>
      <path d="M178 293 V512 H520" stroke="#147b63"/>
      <path d="M520 248 V205" stroke="#b34646" stroke-dasharray="8 10"/>
    </g>
    <rect x="430" y="143" width="180" height="63" rx="10" fill="#fff2f1" stroke="#b34646" stroke-width="2"/>
    <text x="520" y="183" text-anchor="middle" font-size="25" font-weight="700" fill="#9c3232">HMI</text>
    <rect x="83" y="248" width="190" height="90" rx="13" fill="#e2f2ec" stroke="#147b63" stroke-width="2"/>
    <text x="178" y="304" text-anchor="middle" font-size="32" font-weight="700">Switch A</text>
    <rect x="425" y="248" width="190" height="90" rx="13" fill="#fff2f1" stroke="#b34646" stroke-width="3"/>
    <text x="520" y="283" text-anchor="middle" font-size="26" font-weight="700" fill="#9c3232">Switch B</text>
    <text x="520" y="318" text-anchor="middle" font-size="24" fill="#9c3232">HỎNG</text>
    <rect x="83" y="467" width="190" height="90" rx="13" fill="#e2f2ec" stroke="#147b63" stroke-width="2"/>
    <text x="178" y="523" text-anchor="middle" font-size="32" font-weight="700">Switch D</text>
    <rect x="425" y="467" width="190" height="90" rx="13" fill="#e2f2ec" stroke="#147b63" stroke-width="2"/>
    <text x="520" y="523" text-anchor="middle" font-size="32" font-weight="700">Switch C</text>
    <rect x="247" y="379" width="345" height="48" rx="9" fill="#fff2f1"/>
    <text x="419" y="410" text-anchor="middle" font-size="21" fill="#9c3232">HMI chỉ gắn vào B: mất liên lạc</text>
    <text x="360" y="604" text-anchor="middle" font-size="24" font-weight="700" fill="#147b63">A ↔ D ↔ C: còn đường liên lạc</text>
    <text x="36" y="686" font-size="20">Giả định cơ chế vòng hỗ trợ lỗi này, cấu hình đúng</text>
    <text x="36" y="717" font-size="20">và đã hoàn tất chuyển đường. Không vẽ trạng thái cổng.</text>
    <text x="36" y="765" font-size="18" fill="#51697b">Sơ đồ khái niệm • DTPT Techs biên tập</text>
    <text x="36" y="795" font-size="18" fill="#51697b">Không phải sơ đồ đấu nối hoặc kết quả thử nghiệm</text>
  </g>
</svg>
