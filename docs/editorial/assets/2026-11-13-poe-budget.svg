<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Giới hạn mỗi cổng và ngân sách PoE tổng</title>
  <desc id="desc">Phép tính từ tài liệu NETGEAR GS108PEv3. Bốn cổng nhân 15,4 watt bằng 61,6 watt, trong khi tổng ngân sách PoE là 53 watt. Chênh lệch 8,6 watt.</desc>
  <rect width="720" height="620" rx="24" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" fill="#16334b">
    <text x="40" y="58" font-size="29" font-weight="700">Kiểm tra cả từng cổng và tổng</text>
    <text x="40" y="103" font-size="24">Ví dụ từ tài liệu NETGEAR GS108PEv3</text>
    <text x="40" y="167" font-size="27">4 cổng × 15,4 W = 61,6 W</text>
    <rect x="40" y="190" width="600" height="62" rx="9" fill="#2168ac"/>
    <text x="60" y="231" font-size="27" font-weight="700" fill="#fff">Tổng nếu cùng đạt giới hạn</text>
    <text x="40" y="310" font-size="27">Budget PoE tổng được công bố: 53 W</text>
    <rect x="40" y="335" width="516.2" height="62" rx="9" fill="#f0a13a"/>
    <text x="60" y="376" font-size="27" font-weight="700">53 W</text>
    <rect x="40" y="434" width="640" height="96" rx="12" fill="#fff" stroke="#b4c6d4" stroke-width="2"/>
    <text x="60" y="475" font-size="28" font-weight="700">Chênh lệch 61,6 − 53 = 8,6 W</text>
    <text x="60" y="511" font-size="23">Đối chiếu tải cần cấp đồng thời</text>
    <text x="40" y="580" font-size="22">DTPT Techs · Hình tính toán từ giới hạn công bố</text>
  </g>
</svg>
