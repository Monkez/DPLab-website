<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">AI và PLC cùng host: kết quả hợp lệ trước khi điều khiển</title>
  <desc id="desc">Sơ đồ phân vai: AI xử lý ảnh, kết quả có mã vật và thời điểm được kiểm tra hợp lệ, PLC phối hợp chuyển động qua EtherCAT tới drive và I/O. Các chức năng an toàn cần thiết kế riêng theo đánh giá rủi ro.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#566b82" stroke-width="2"/></marker></defs>
  <rect width="720" height="900" fill="#f3f6fa"/>
  <g font-family="Arial, sans-serif" fill="#17314b">
    <text x="36" y="44" font-size="20" font-weight="700" letter-spacing="1">DTPT TECHS · SƠ ĐỒ BIÊN TẬP</text>
    <text x="36" y="94" font-size="32" font-weight="700">CÙNG HOST, RÕ PHÂN VAI</text>
    <rect x="28" y="124" width="664" height="566" rx="24" fill="#fff" stroke="#9bafc1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="52" y="161" font-size="24" font-weight="700">Máy tính công nghiệp</text>
    <rect x="52" y="186" width="616" height="112" rx="15" fill="#e4effd" stroke="#517dab" stroke-width="2"/>
    <text x="76" y="226" font-size="30" font-weight="700">AI xử lý ảnh</text>
    <text x="76" y="268" font-size="25">Kết quả + mã vật + thời điểm</text>
    <path d="M360 303 V335" stroke="#566b82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="52" y="348" width="616" height="112" rx="15" fill="#fff1d6" stroke="#b4852c" stroke-width="2"/>
    <text x="76" y="389" font-size="29" font-weight="700">Kiểm tra điều kiện sử dụng</text>
    <text x="76" y="431" font-size="25">Còn hạn? Đúng vật? Máy sẵn sàng?</text>
    <path d="M360 465 V497" stroke="#566b82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="52" y="510" width="616" height="142" rx="15" fill="#e0f2e9" stroke="#3c8262" stroke-width="2"/>
    <text x="76" y="551" font-size="30" font-weight="700">PLC / điều khiển chuyển động</text>
    <text x="76" y="593" font-size="25">Chu kỳ và quy tắc xử lý lỗi xác định</text>
    <text x="76" y="630" font-size="25">EtherCAT Master → drive / I/O</text>
    <rect x="28" y="714" width="664" height="98" rx="15" fill="#fff" stroke="#8c9baa" stroke-width="2"/>
    <text x="52" y="751" font-size="27" font-weight="700">Chức năng an toàn</text>
    <text x="52" y="789" font-size="24">Thiết kế riêng theo đánh giá rủi ro.</text>
    <text x="36" y="850" font-size="23">Minh họa logic; không phải sơ đồ điện.</text>
    <text x="36" y="882" font-size="22">Không thể hiện cấu hình hay kết quả đã chứng nhận.</text>
  </g>
</svg>
